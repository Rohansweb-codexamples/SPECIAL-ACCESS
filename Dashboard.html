<!doctype html>
<html lang="en"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rohansweb Dashboard</title>
<style>
:root{color-scheme:dark;--orange:#ff8a00;--yellow:#ffd54a}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px;font-family:Arial,system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 15% 15%,#63320e 0,transparent 35%),radial-gradient(ellipse at 85% 80%,#52240c 0,transparent 40%),linear-gradient(135deg,#100d16,#21101b 55%,#0b1019)}header,main,footer{max-width:1050px;margin-left:auto;margin-right:auto}header{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--yellow),var(--orange),#ed4d24);display:grid;place-items:center;color:#211207;font-weight:900;font-size:21px}.brand small{display:block;color:#b9b2bf;margin-top:4px}button{border:1px solid #ffffff25;background:#ffffff0c;color:white;border-radius:11px;padding:11px 15px;cursor:pointer}main{margin-top:65px}.hero{padding:clamp(24px,5vw,48px);border:1px solid #ffffff20;border-radius:25px;background:#17141de8;box-shadow:0 28px 90px #0006}.eyebrow{color:var(--yellow);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(38px,7vw,65px);letter-spacing:-2px;margin:12px 0}p{color:#c8c2ce;line-height:1.7}.line{height:4px;border-radius:5px;background:linear-gradient(90deg,var(--yellow),var(--orange));margin-top:22px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:18px}.tile{padding:22px;border:1px solid #ffffff18;border-radius:17px;background:#ffffff08}.tile strong{display:block;margin-bottom:8px}.tile span{font-size:13px;color:#bdb5c4}footer{margin-top:28px;color:#8f8795;font-size:11px}
</style></head><body>
<header><div class="brand"><div class="mark">R</div><div><strong>Rohansweb</strong><small>Special Access Dashboard</small></div></div><button id="signOut">Sign out</button></header>
<main><section class="hero"><div class="eyebrow">Access granted</div><h1 id="greeting">Hi there!</h1><p>Welcome to your Rohansweb Special Access dashboard.</p><div class="line"></div></section>
<section class="tiles"><article class="tile"><strong>Special Access</strong><span>Your access code was accepted.</span></article><article class="tile"><strong>Rohansweb</strong><span>Your personal access area.</span></article><article class="tile"><strong>Session</strong><span>Sign out when you have finished.</span></article></section></main><footer>ROHANSWEB · SPECIAL ACCESS</footer>
<script>
const name = sessionStorage.getItem('rwSpecialAccessName');
if (!name) { window.location.href = '?'; } else { document.getElementById('greeting').textContent = 'Hi ' + name + '!'; }
document.getElementById('signOut').addEventListener('click', function(){sessionStorage.removeItem('rwSpecialAccessName');window.location.href='?';});
</script></body></html>
