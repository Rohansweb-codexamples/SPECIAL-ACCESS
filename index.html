<!doctype html>
<html lang="en"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rohansweb Special Access</title>
<style>
:root{color-scheme:dark;--orange:#ff8a00;--yellow:#ffd54a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Arial,system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 15% 15%,#63320e 0,transparent 35%),radial-gradient(ellipse at 85% 80%,#52240c 0,transparent 40%),linear-gradient(135deg,#100d16,#21101b 55%,#0b1019)}.wrap{width:min(100%,440px)}.brand{display:flex;align-items:center;gap:12px;margin:0 0 20px 5px}.mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--yellow),var(--orange),#ed4d24);display:grid;place-items:center;color:#211207;font-weight:900;font-size:21px}.brand small{display:block;color:#b9b2bf;margin-top:4px}.panel{padding:30px;border:1px solid #ffffff20;border-radius:24px;background:#17141df0;box-shadow:0 28px 90px #0008}.eyebrow{color:var(--yellow);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-size:35px;line-height:1.1;margin:13px 0 10px;letter-spacing:-1px}p{color:#c8c2ce;font-size:14px;line-height:1.6}label{display:block;font-size:12px;font-weight:700;margin:20px 0 8px}input{width:100%;height:49px;border:1px solid #ffffff24;background:#0e0c12;color:#fff;border-radius:12px;padding:0 14px;font:inherit}input:focus{outline:2px solid var(--orange);outline-offset:2px}button,.service-link{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:15px;border:0;border-radius:12px;background:linear-gradient(100deg,var(--yellow),var(--orange));color:#211207;font-weight:900;font-size:14px;cursor:pointer;text-decoration:none}button:disabled{opacity:.65;cursor:wait}#status{min-height:22px;color:#ffb5a8;font-size:13px;margin-top:13px}.service-link{background:#28212f;color:#ffe0a1;border:1px solid #ffffff24;margin-top:10px}.foot{color:#8f8795;font-size:11px;margin:18px 5px}
</style></head><body><main class="wrap"><header class="brand"><div class="mark">R</div><div><strong>Rohansweb</strong><small>Special Access Portal</small></div></header><section class="panel"><div class="eyebrow">Restricted area</div><h1>Access, by invitation.</h1><p>Enter your access code to continue.</p>
<form id="form"><label for="code">ACCESS CODE</label><input id="code" type="password" autocomplete="current-password" placeholder="Enter access code" required><button id="submit" type="submit">Verify access →</button><div id="status" role="status" aria-live="polite"></div><a class="service-link" id="appsScriptLink" href="https://script.google.com/a/macros/downhallprimary.com/s/AKfycbx8IQxYAVKFY5_lIDqgCZ2sm7dyz6-7f-9nFaXYaeDr6cB21w_ttn0vkk66kFkg9uq5wQ/exec">Open Google Apps Script access page</a></form></section><div class="foot">ROHANSWEB · SPECIAL ACCESS</div></main>
<script>
const APPS_SCRIPT_URL='https://script.google.com/a/macros/downhallprimary.com/s/AKfycbx8IQxYAVKFY5_lIDqgCZ2sm7dyz6-7f-9nFaXYaeDr6cB21w_ttn0vkk66kFkg9uq5wQ/exec';
const form=document.getElementById('form'),button=document.getElementById('submit'),status=document.getElementById('status');
document.getElementById('appsScriptLink').href=APPS_SCRIPT_URL;
form.addEventListener('submit',function(e){e.preventDefault();const code=document.getElementById('code').value.trim();if(!code){status.textContent='Enter your access code.';return}
if(!(window.google&&google.script&&google.script.run)){status.textContent='Code verification is available inside the deployed Apps Script app. Use the link below to open it.';return}
button.disabled=true;button.textContent='Checking…';status.textContent='';
google.script.run.withSuccessHandler(function(result){button.disabled=false;button.textContent='Verify access →';if(!result||!result.ok){status.textContent=result&&result.message?result.message:'That code was not accepted.';return}sessionStorage.setItem('rwSpecialAccessName',result.name);window.location.href='?page=dashboard';}).withFailureHandler(function(){button.disabled=false;button.textContent='Verify access →';status.textContent='Could not connect. Please try again.';}).checkAccessCode(code);
});
</script></body></html>
